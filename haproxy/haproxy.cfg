global
    log stdout format raw local0
    maxconn 100

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# ─── auth_db ───────────────────────────────────────────────────────────────────

frontend auth_db
    bind *:5433
    default_backend auth_db_backend

backend auth_db_backend
    option pgsql-check user postgres
    server primary  postgres-auth:5432         check resolvers docker init-addr none
    server replica  postgres-auth-replica:5432 check backup resolvers docker init-addr none

# ─── contenido_db ──────────────────────────────────────────────────────────────

frontend contenido_db
    bind *:5434
    default_backend contenido_db_backend

backend contenido_db_backend
    option pgsql-check user postgres
    server primary  postgres-contenido:5432         check resolvers docker init-addr none
    server replica  postgres-contenido-replica:5432 check backup resolvers docker init-addr none
