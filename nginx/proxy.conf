server {
    listen 80;

    # Usa el DNS interno de Docker y re-resuelve cada 10 segundos
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/auth/ {
        set $backend "auth-api:3001";
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/contenido/ {
        set $backend "contenido-api:3000";
        rewrite ^/api/contenido/(.*) /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m;
    }

    location /api/citas/ {
        set $backend "api-net:5233";
        rewrite ^/api/citas/(.*) /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        set $backend "santino-web:4200";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
