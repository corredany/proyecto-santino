<header class="header" [class.scrolled]="scrolled" [class.menu-open]="menuAbierto" [class.en-contacto]="enContacto && !scrolled">

  <a routerLink="/" class="header-logo" (click)="cerrarMenu()">
    <img src="img/santino.png" alt="Santino" />
  </a>

  <nav class="header-nav" [class.open]="menuAbierto">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
       (click)="cerrarMenu()">Inicio</a>

    <div class="nav-dropdown" [class.open]="serviciosAbierto">
      <button class="nav-dropdown-trigger" (click)="serviciosAbierto = !serviciosAbierto">
        Servicios <span class="chevron">&#8250;</span>
      </button>
      <ul class="dropdown-list">
        @for (s of secciones; track s.slug) {
          <li>
            <a [routerLink]="['/servicios', s.slug]" (click)="cerrarMenu()">{{ s.nombre }}</a>
          </li>
        }
      </ul>
    </div>

    <a routerLink="/nosotros" routerLinkActive="active" (click)="cerrarMenu()">Nosotros</a>
    <a routerLink="/contacto" class="nav-cta" (click)="cerrarMenu()">Contáctanos</a>
  </nav>

  <button class="hamburger" (click)="toggleMenu()" [class.open]="menuAbierto" aria-label="Menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

</header>
