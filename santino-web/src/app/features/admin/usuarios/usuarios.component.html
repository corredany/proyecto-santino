<div class="page-header">
  <h1>Usuarios</h1>
  <button class="btn-primary" (click)="abrirNuevo()">+ Nuevo usuario</button>
</div>

@if (mostrarForm) {
  <div class="modal-overlay" (click)="mostrarForm = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h2>{{ editandoId ? 'Editar' : 'Nuevo' }} Usuario</h2>
      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" [(ngModel)]="form.nombre" required>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="form.email" required>
      </div>
      @if (!editandoId) {
        <div class="form-group">
          <label>Contraseña *</label>
          <input type="password" [(ngModel)]="form.contrasena" required>
        </div>
      }
      <div class="form-group">
        <label>Rol</label>
        <select [(ngModel)]="form.rolId">
          @for (rol of roles; track rol.id) {
            <option [ngValue]="rol.id">{{ rol.nombre }}</option>
          }
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" (click)="mostrarForm = false">Cancelar</button>
        <button class="btn-primary" (click)="guardar()">Guardar</button>
      </div>
    </div>
  </div>
}

@if (cargando) { <p class="loading-msg">Cargando...</p> }

<table class="data-table">
  <thead>
    <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    @for (u of usuarios; track u.id) {
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.nombre }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.rol?.nombre }}</td>
        <td class="actions">
          <button class="btn-edit" (click)="abrirEditar(u)">Editar</button>
          <button class="btn-delete" (click)="eliminar(u.id)">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>
